name: 🐛 Bug Report
description: Report a bug to help us improve DRS AI
title: "[BUG] <short description>"
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report! 🐛

        Before submitting, please:
        - Search existing issues to avoid duplicates
        - Check the [troubleshooting docs](https://github.com/CTO-DRS/DRS-AI/blob/main/docs/troubleshooting.md)
        - For security vulnerabilities, use [GitHub Security Advisories](https://github.com/CTO-DRS/DRS-AI/security/advisories/new) instead

  - type: input
    id: version
    attributes:
      label: DRS AI Version
      description: Run `git rev-parse --short HEAD` or check the version in `package.json`
      placeholder: "1.0.0 or commit SHA"
    validations:
      required: true

  - type: dropdown
    id: service
    attributes:
      label: Affected Service
      description: Which service(s) is the bug in?
      options:
        - Gateway (3000)
        - Auth (3001)
        - Model Router (3002)
        - Orchestrator (3003)
        - Memory (3004)
        - Files (3005)
        - Voice (3006)
        - Dashboard (3007)
        - Telegram Bot (3010)
        - Workflow Engine (3011)
        - Plugin System (3012)
        - Auto Agent (3013)
        - Code Interpreter (3014)
        - Cybersecurity (3015)
        - Advanced Memory (3016)
        - Multi-Model (3017)
        - Auto Builder (3018)
        - Security Sandbox (3020)
        - LLM Guardrail (3021)
        - Hybrid RAG (3022)
        - Polyglot Interpreter (3023)
        - Git Automator (3024)
        - Edge Optimizer (3025)
        - Cognitive AI (3030)
        - Web3 Mesh (3031)
        - Quantum Security (3032)
        - Ultra Efficiency (3033)
        - Human Interaction (3034)
        - Self-Healing (3035)
        - Cultural Localization (3036)
        - Self-Awareness (3037)
        - GPU Acceleration (3038)
        - Distributed Deployment (3039)
        - Federated Learning (3040)
        - Multi-Region Replication (3041)
        - OAuth2 / OIDC (3042)
        - GPU MIG / Time-Slicing (3043)
        - Frontend
        - Mobile App
        - Desktop App
        - CLI
        - Kubernetes / Helm chart
        - Docker Compose
        - Other / multiple
    validations:
      required: true

  - type: dropdown
    id: deployment
    attributes:
      label: Deployment Type
      options:
        - Docker Compose
        - Kubernetes (Helm chart)
        - Manual / source
        - Termux (Android)
        - Other
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: Operating System
      placeholder: "Ubuntu 22.04, macOS 14, Windows 11, Android 14..."
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear and concise description of the bug.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Detailed steps so we can reproduce the bug.
      value: |
        1.
        2.
        3.
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: |
        Relevant log output. Set `LOG_LEVEL=debug` if needed.
        Tip: You can attach images or log files by clicking the area below.
      render: shell

  - type: textarea
    id: config
    attributes:
      label: Configuration
      description: |
        Your `.env` values (REMOVE SECRETS FIRST!) and any custom `docker-compose.override.yml`.
      render: yaml

  - type: checkboxes
    id: terms
    attributes:
      label: Code of Conduct
      description: By submitting this issue, you agree to follow our [Code of Conduct](https://github.com/CTO-DRS/DRS-AI/blob/main/CODE_OF_CONDUCT.md)
      options:
        - label: I agree to follow the Code of Conduct
          required: true
        - label: I have searched existing issues to avoid duplicates
          required: true
        - label: I have redacted all secrets / passwords from my report
          required: true
