name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================
  # Lint & Type-Check all Node.js services
  # ============================================
  lint-and-test:
    name: Lint & Test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 18 dropped: merged dependency baselines (ioredis 6, pgvector 0.3,
        # vite 8) declare engines >=20/22 and the Docker runtime images are
        # node 20+; testing on 18 stopped being representative.
        node-version: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          # no npm cache: repo intentionally commits no lock files,
          # and setup-node cache requires package-lock.json/yarn.lock

      - name: Find all Node.js services
        id: services
        run: |
          services=$(find . -maxdepth 3 -name "package.json" -not -path "*/node_modules/*" -not -path "*/.git/*" -exec dirname {} \; | sort -u)
          echo "services<<EOF" >> $GITHUB_OUTPUT
          echo "$services" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Install & test each service
        env:
          SERVICES: ${{ steps.services.outputs.services }}
        run: |
          # read service list via env (raw multiline interpolation here breaks bash
          # parsing and is a script-injection vector); skip blank lines
          FAILED_SERVICES="/tmp/failed-services.txt"
          : > "$FAILED_SERVICES"
          while IFS= read -r service; do
            [ -z "$service" ] && continue
            echo "::group::🔧 Processing $service"
            cd "$GITHUB_WORKSPACE/$service"

            # Skip if no package.json scripts
            if [ ! -f "package.json" ]; then
              echo "No package.json, skipping"
              continue
            fi

            # Install (hard failure: a service that cannot install is broken)
            npm install --no-audit --no-fund --loglevel=error || {
              echo "::error::npm install failed for $service"
              echo "$service (install)" >> "$FAILED_SERVICES"
              echo "::endgroup::"
              cd "$GITHUB_WORKSPACE"
              continue
            }

            # Lint if available (advisory: style-level, tracked as warning)
            if npm run | grep -q "lint"; then
              npm run lint || {
                echo "::warning::Lint failed for $service"
              }
            fi

            # Type-check TypeScript services (hard failure)
            if npm run | grep -q "typecheck"; then
              npm run typecheck || {
                echo "::error::Type check failed for $service"
                echo "$service (typecheck)" >> "$FAILED_SERVICES"
              }
            fi

            # Run tests if available (hard failure)
            if npm run | grep -q "test"; then
              npm test || {
                echo "::error::Tests failed for $service"
                echo "$service (test)" >> "$FAILED_SERVICES"
              }
            fi

            # Verify the service boots (smoke test)
            PORT=13999 timeout 5 node src/server.js > /tmp/boot-test.log 2>&1 &
            BOOT_PID=$!
            sleep 3
            if curl -sf http://localhost:13999/health > /dev/null 2>&1 || \
               curl -sf http://localhost:13999/health/live > /dev/null 2>&1; then
              echo "✅ Health check passed"
            else
              echo "::warning::Health check failed for $service (may require Redis/Postgres)"
            fi
            kill $BOOT_PID 2>/dev/null || true
            wait $BOOT_PID 2>/dev/null || true
            cd "$GITHUB_WORKSPACE"
            echo "::endgroup::"
          done <<< "$SERVICES"

          # Aggregate gate: install/typecheck/test failures must fail the job.
          # (Boot smoke stays advisory because services need Redis/Postgres.)
          if [ -s "$FAILED_SERVICES" ]; then
            echo "::error::Service verification failed for:"
            cat "$FAILED_SERVICES"
            exit 1
          fi

  # ============================================
  # Validate Helm chart
  # ============================================
  helm-lint:
    name: Helm Chart Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: 'v3.14.0'

      - name: Lint Helm chart
        run: |
          helm lint k8s/helm/drs-ai

      - name: Render templates (dry-run)
        run: |
          helm template drs-ai k8s/helm/drs-ai --namespace drs-ai --debug > /tmp/rendered.yaml 2>&1 || {
            echo "::warning::Helm template render failed (may be expected for missing CRDs)"
            cat /tmp/rendered.yaml
          }

  # ============================================
  # Validate Docker Compose
  # ============================================
  compose-validate:
    name: Docker Compose Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate docker-compose.yml
        run: |
          docker compose config -q || {
            echo "::error::docker-compose.yml is invalid"
            exit 1
          }

      - name: Count services
        run: |
          services=$(docker compose config --services | wc -l)
          echo "Total services in docker-compose: $services"
          echo "::notice::Validated $services services in docker-compose.yml"

  # ============================================
  # Check for secrets / credentials
  # ============================================
  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: TruffleHog OSS
        uses: trufflesecurity/trufflehog@v3.99.2 # pinned: floating  is a supply-chain risk
        with:
          path: .
          extra_args: --only-verified --exclude-paths .github/trufflehog-exclude.txt

      - name: Check for common secret patterns
        run: |
          # Simple grep-based check for obvious secrets
          if grep -rE "(api[_-]?key|password|secret|token)\s*[:=]\s*['\"]?[a-zA-Z0-9]{20,}" \
            --include="*.ts" --include="*.js" --include="*.tsx" --include="*.json" \
            --exclude-dir=node_modules --exclude-dir=.git --exclude="*.example" \
            . 2>/dev/null; then
            echo "::error::Potential secrets found in source code"
            exit 1
          fi
          echo "✅ No obvious secrets found"

  # ============================================
  # README link check
  # ============================================
  readme-check:
    name: README & Docs Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check markdown links
        uses: gaurav-nelson/github-action-markdown-link-check@v1
        with:
          use-quiet-mode: 'yes'
          config-file: '.github/markdown-link-check.json'
          folder-path: 'docs'
          file-path: './README.md ./CHANGELOG.md ./CONTRIBUTING.md ./SECURITY.md'

      - name: Check that all services have README
        run: |
          missing=0
          for service in $(ls -d */); do
            service=${service%/}
            if [ -f "$service/package.json" ] || [ -f "$service/Dockerfile" ]; then
              if [ ! -f "$service/README.md" ]; then
                echo "::warning::Missing README in $service/"
                missing=$((missing + 1))
              fi
            fi
          done
          if [ "$missing" -gt 5 ]; then
            echo "::error::Too many services missing READMEs ($missing)"
            exit 1
          fi
          echo "Services missing READMEs: $missing (acceptable ≤ 5)"
