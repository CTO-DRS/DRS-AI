<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 320" width="1280" height="320">
  <defs>
    <linearGradient id="bannerBg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0a0a0a"/>
      <stop offset="50%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#0a0a0a"/>
    </linearGradient>
    <linearGradient id="logoGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="nodeGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1280" height="320" fill="url(#bannerBg)"/>

  <!-- Hex grid pattern -->
  <g opacity="0.05" fill="#6366f1">
    <polygon points="50,80 80,62 110,80 110,116 80,134 50,116"/>
    <polygon points="200,200 230,182 260,200 260,236 230,254 200,236"/>
    <polygon points="1100,60 1130,42 1160,60 1160,96 1130,114 1100,96"/>
    <polygon points="1150,220 1180,202 1210,220 1210,256 1180,274 1150,256"/>
    <polygon points="700,30 730,12 760,30 760,66 730,84 700,66"/>
    <polygon points="950,260 980,242 1010,260 1010,296 980,314 950,296"/>
  </g>

  <!-- Logo on left -->
  <g transform="translate(80, 80)">
    <rect width="160" height="160" rx="36" fill="url(#logoGrad)"/>
    <circle cx="80" cy="80" r="20" fill="#fff"/>
    <circle cx="80" cy="80" r="14" fill="#6366f1"/>
    <circle cx="44" cy="44" r="9" fill="url(#nodeGrad)"/>
    <circle cx="116" cy="44" r="9" fill="url(#nodeGrad)"/>
    <circle cx="34" cy="80" r="9" fill="url(#nodeGrad)"/>
    <circle cx="126" cy="80" r="9" fill="url(#nodeGrad)"/>
    <circle cx="44" cy="116" r="9" fill="url(#nodeGrad)"/>
    <circle cx="116" cy="116" r="9" fill="url(#nodeGrad)"/>
    <g stroke="#fff" stroke-width="2" opacity="0.95">
      <line x1="80" y1="80" x2="44" y2="44"/>
      <line x1="80" y1="80" x2="116" y2="44"/>
      <line x1="80" y1="80" x2="34" y2="80"/>
      <line x1="80" y1="80" x2="126" y2="80"/>
      <line x1="80" y1="80" x2="44" y2="116"/>
      <line x1="80" y1="80" x2="116" y2="116"/>
    </g>
  </g>

  <!-- Title text -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif">
    <text x="280" y="155" font-size="72" font-weight="700" fill="#ffffff">DRS AI</text>
    <text x="280" y="205" font-size="28" font-weight="400" fill="#a78bfa">Enterprise AI Operating System</text>
    <text x="280" y="240" font-size="18" font-weight="400" fill="#6b7280">40+ microservices · Self-hosted · 100% offline</text>
  </g>

  <!-- Right side: tech badges -->
  <g transform="translate(960, 100)" font-family="monospace" font-size="11">
    <g transform="translate(0, 0)">
      <rect width="220" height="28" rx="14" fill="rgba(99, 102, 241, 0.15)" stroke="rgba(99, 102, 241, 0.4)"/>
      <circle cx="20" cy="14" r="4" fill="#22c55e"/>
      <text x="35" y="18" fill="#a5b4fc">Node.js · TypeScript</text>
    </g>
    <g transform="translate(0, 36)">
      <rect width="220" height="28" rx="14" fill="rgba(99, 102, 241, 0.15)" stroke="rgba(99, 102, 241, 0.4)"/>
      <circle cx="20" cy="14" r="4" fill="#22c55e"/>
      <text x="35" y="18" fill="#a5b4fc">React · React Native</text>
    </g>
    <g transform="translate(0, 72)">
      <rect width="220" height="28" rx="14" fill="rgba(99, 102, 241, 0.15)" stroke="rgba(99, 102, 241, 0.4)"/>
      <circle cx="20" cy="14" r="4" fill="#22c55e"/>
      <text x="35" y="18" fill="#a5b4fc">Docker · Kubernetes</text>
    </g>
    <g transform="translate(0, 108)">
      <rect width="220" height="28" rx="14" fill="rgba(99, 102, 241, 0.15)" stroke="rgba(99, 102, 241, 0.4)"/>
      <circle cx="20" cy="14" r="4" fill="#22c55e"/>
      <text x="35" y="18" fill="#a5b4fc">Ollama · pgvector</text>
    </g>
  </g>
</svg>
