<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640">
  <defs>
    <linearGradient id="bannerBg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0a0a0a"/>
      <stop offset="50%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#0a0a0a"/>
    </linearGradient>
    <linearGradient id="logoGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="nodeGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1280" height="640" fill="url(#bannerBg)"/>

  <!-- Hex grid pattern -->
  <g opacity="0.06" fill="#6366f1">
    <polygon points="50,160 100,128 150,160 150,224 100,256 50,224"/>
    <polygon points="400,400 450,368 500,400 500,464 450,496 400,464"/>
    <polygon points="1100,120 1150,88 1200,120 1200,184 1150,216 1100,184"/>
    <polygon points="1150,440 1200,408 1250,440 1250,504 1200,536 1150,504"/>
    <polygon points="700,60 750,28 800,60 800,124 750,156 700,124"/>
    <polygon points="950,520 1000,488 1050,520 1050,584 1000,616 950,584"/>
    <polygon points="200,540 250,508 300,540 300,604 250,636 200,604"/>
  </g>

  <!-- Logo on left, larger for social preview -->
  <g transform="translate(80, 160)" filter="url(#glow)">
    <rect width="320" height="320" rx="72" fill="url(#logoGrad)"/>
    <circle cx="160" cy="160" r="40" fill="#fff"/>
    <circle cx="160" cy="160" r="28" fill="#6366f1"/>
    <circle cx="88" cy="88" r="18" fill="url(#nodeGrad)"/>
    <circle cx="232" cy="88" r="18" fill="url(#nodeGrad)"/>
    <circle cx="68" cy="160" r="18" fill="url(#nodeGrad)"/>
    <circle cx="252" cy="160" r="18" fill="url(#nodeGrad)"/>
    <circle cx="88" cy="232" r="18" fill="url(#nodeGrad)"/>
    <circle cx="232" cy="232" r="18" fill="url(#nodeGrad)"/>
    <g stroke="#fff" stroke-width="4" opacity="0.95">
      <line x1="160" y1="160" x2="88" y2="88"/>
      <line x1="160" y1="160" x2="232" y2="88"/>
      <line x1="160" y1="160" x2="68" y2="160"/>
      <line x1="160" y1="160" x2="252" y2="160"/>
      <line x1="160" y1="160" x2="88" y2="232"/>
      <line x1="160" y1="160" x2="232" y2="232"/>
    </g>
  </g>

  <!-- Title text -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif">
    <text x="450" y="260" font-size="120" font-weight="800" fill="#ffffff">DRS AI</text>
    <text x="450" y="320" font-size="36" font-weight="500" fill="#a78bfa">Enterprise AI Operating System</text>
    <text x="450" y="360" font-size="22" font-weight="400" fill="#94a3b8">40+ microservices · Self-hosted · 100% offline</text>
  </g>

  <!-- Right side: tech badges -->
  <g transform="translate(880, 200)" font-family="monospace" font-size="14">
    <g transform="translate(0, 0)">
      <rect width="280" height="36" rx="18" fill="rgba(99, 102, 241, 0.15)" stroke="rgba(99, 102, 241, 0.4)"/>
      <circle cx="22" cy="18" r="5" fill="#22c55e"/>
      <text x="40" y="23" fill="#a5b4fc">Node.js · TypeScript</text>
    </g>
    <g transform="translate(0, 48)">
      <rect width="280" height="36" rx="18" fill="rgba(99, 102, 241, 0.15)" stroke="rgba(99, 102, 241, 0.4)"/>
      <circle cx="22" cy="18" r="5" fill="#22c55e"/>
      <text x="40" y="23" fill="#a5b4fc">React · React Native</text>
    </g>
    <g transform="translate(0, 96)">
      <rect width="280" height="36" rx="18" fill="rgba(99, 102, 241, 0.15)" stroke="rgba(99, 102, 241, 0.4)"/>
      <circle cx="22" cy="18" r="5" fill="#22c55e"/>
      <text x="40" y="23" fill="#a5b4fc">Docker · Kubernetes</text>
    </g>
    <g transform="translate(0, 144)">
      <rect width="280" height="36" rx="18" fill="rgba(99, 102, 241, 0.15)" stroke="rgba(99, 102, 241, 0.4)"/>
      <circle cx="22" cy="18" r="5" fill="#22c55e"/>
      <text x="40" y="23" fill="#a5b4fc">Ollama · pgvector</text>
    </g>
    <g transform="translate(0, 192)">
      <rect width="280" height="36" rx="18" fill="rgba(99, 102, 241, 0.15)" stroke="rgba(99, 102, 241, 0.4)"/>
      <circle cx="22" cy="18" r="5" fill="#22c55e"/>
      <text x="40" y="23" fill="#a5b4fc">Multi-region · Federated Learning</text>
    </g>
  </g>

  <!-- Bottom URL -->
  <text x="640" y="600" text-anchor="middle" font-family="monospace" font-size="18" fill="#6b7280">github.com/CTO-DRS/DRS-AI  ·  drs.xo.je</text>
</svg>
