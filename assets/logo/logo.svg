<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="nodeGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background rounded square -->
  <rect x="0" y="0" width="256" height="256" rx="56" fill="url(#bgGrad)"/>

  <!-- Hexagonal grid pattern (subtle) -->
  <g opacity="0.08" fill="#fff">
    <polygon points="40,80 60,68 80,80 80,104 60,116 40,104"/>
    <polygon points="176,80 196,68 216,80 216,104 196,116 176,104"/>
    <polygon points="108,40 128,28 148,40 148,64 128,76 108,64"/>
    <polygon points="108,160 128,148 148,160 148,184 128,196 108,184"/>
  </g>

  <!-- Central "D" mark - stylized brain/network -->
  <g filter="url(#glow)">
    <!-- Central node -->
    <circle cx="128" cy="128" r="28" fill="#fff"/>
    <circle cx="128" cy="128" r="20" fill="#6366f1"/>

    <!-- Six surrounding nodes (representing microservices) -->
    <circle cx="80" cy="80" r="14" fill="url(#nodeGrad)"/>
    <circle cx="176" cy="80" r="14" fill="url(#nodeGrad)"/>
    <circle cx="60" cy="128" r="14" fill="url(#nodeGrad)"/>
    <circle cx="196" cy="128" r="14" fill="url(#nodeGrad)"/>
    <circle cx="80" cy="176" r="14" fill="url(#nodeGrad)"/>
    <circle cx="176" cy="176" r="14" fill="url(#nodeGrad)"/>

    <!-- Connecting lines -->
    <g stroke="#fff" stroke-width="3" opacity="0.9">
      <line x1="128" y1="128" x2="80" y2="80"/>
      <line x1="128" y1="128" x2="176" y2="80"/>
      <line x1="128" y1="128" x2="60" y2="128"/>
      <line x1="128" y1="128" x2="196" y2="128"/>
      <line x1="128" y1="128" x2="80" y2="176"/>
      <line x1="128" y1="128" x2="176" y2="176"/>
    </g>

    <!-- Inter-node connections (hexagon) -->
    <g stroke="#fff" stroke-width="1.5" opacity="0.4">
      <line x1="80" y1="80" x2="176" y2="80"/>
      <line x1="80" y1="80" x2="60" y2="128"/>
      <line x1="176" y1="80" x2="196" y2="128"/>
      <line x1="60" y1="128" x2="80" y2="176"/>
      <line x1="196" y1="128" x2="176" y2="176"/>
      <line x1="80" y1="176" x2="176" y2="176"/>
    </g>
  </g>
</svg>
