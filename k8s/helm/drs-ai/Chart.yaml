apiVersion: v2
name: drs-ai
description: DRS AI - Enterprise AI Operating System with 36+ microservices
type: application
version: 1.0.0
appVersion: "1.0.0"
home: https://github.com/CTO-DRS/DRS-AI
sources:
  - https://github.com/CTO-DRS/DRS-AI
maintainers:
  - name: DRS Team
    url: https://github.com/CTO-DRS
keywords:
  - ai
  - llm
  - ollama
  - rag
  - microservices
  - kubernetes
icon: https://raw.githubusercontent.com/CTO-DRS/DRS-AI/main/assets/logo.png
dependencies:
  - name: postgresql
    version: "15.x.x"
    repository: https://charts.bitnami.com/bitnami
    condition: postgresql.enabled
  - name: redis
    version: "19.x.x"
    repository: https://charts.bitnami.com/bitnami
    condition: redis.enabled
  - name: minio
    version: "14.x.x"
    repository: https://charts.bitnami.com/bitnami
    condition: minio.enabled
  - name: prometheus
    version: "25.x.x"
    repository: https://prometheus-community.github.io/helm-charts
    condition: prometheus.enabled
  - name: grafana
    version: "8.x.x"
    repository: https://grafana.github.io/helm-charts
    condition: grafana.enabled
