{{- if .Values.serviceAccount.create -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.serviceAccount.name | default "drs-ai" }}
  labels:
    {{- include "drs-ai.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
---
apiVersion: v1
kind: Secret
metadata:
  name: drs-ai-secrets
  labels:
    {{- include "drs-ai.labels" . | nindent 4 }}
type: Opaque
stringData:
  jwtSecret: {{ .Values.secrets.jwtSecret | quote }}
  postgresPassword: {{ .Values.secrets.postgresPassword | quote }}
  redisPassword: {{ .Values.secrets.redisPassword | quote }}
  {{- if .Values.secrets.oauthMasterKey }}
  oauthMasterKey: {{ .Values.secrets.oauthMasterKey | quote }}
  {{- end }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: drs-ai-config
  labels:
    {{- include "drs-ai.labels" . | nindent 4 }}
data:
  environment: {{ .Values.global.environment | quote }}
  logLevel: "info"
  transparencyLevel: "high"
