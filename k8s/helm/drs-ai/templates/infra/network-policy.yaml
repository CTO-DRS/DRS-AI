{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: drs-ai-default-deny
  labels: { {{- include "drs-ai.labels" . | nindent 4 }} }
spec:
  podSelector:
    matchLabels:
      {{- include "drs-ai.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: drs-ai-allow-internal
  labels: { {{- include "drs-ai.labels" . | nindent 4 }} }
spec:
  podSelector:
    matchLabels:
      {{- include "drs-ai.selectorLabels" . | nindent 6 }}
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "drs-ai.selectorLabels" . | nindent 14 }}
  egress:
    - to:
        - podSelector:
            matchLabels:
              {{- include "drs-ai.selectorLabels" . | nindent 14 }}
{{- end }}
