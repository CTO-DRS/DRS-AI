global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'gateway'
    static_configs:
      - targets: ['gateway:3000']
    metrics_path: /metrics

  - job_name: 'auth'
    static_configs:
      - targets: ['auth:3001']
    metrics_path: /metrics

  - job_name: 'router'
    static_configs:
      - targets: ['router:3002']
    metrics_path: /metrics

  - job_name: 'orchestrator'
    static_configs:
      - targets: ['orchestrator:3003']
    metrics_path: /metrics

  - job_name: 'memory'
    static_configs:
      - targets: ['memory:3004']
    metrics_path: /metrics

  - job_name: 'files'
    static_configs:
      - targets: ['files:3005']
    metrics_path: /metrics

  - job_name: 'voice'
    static_configs:
      - targets: ['voice:3006']
    metrics_path: /metrics

  - job_name: 'dashboard'
    static_configs:
      - targets: ['dashboard:3007']
    metrics_path: /metrics
