# DRS AI - Termux Configuration
# Place this file at ~/.termux/termux.properties

# Terminal
terminal-transcript-rows=10000
terminal-cursor-style=bar
terminal-cursor-blink-rate=500

# Keyboard
extra-keys=[['ESC','/','-','HOME','UP','END','PGUP'],['TAB','CTRL','ALT','LEFT','DOWN','RIGHT','PGDN']]
extra-keys-style=default

# Bell
bell-character=beep
back-key=escape

# Clipboard
use-black-ui=true
fullscreen=false

# Performance optimizations
use-execve=true
allow-external-apps=true

# Storage
default-working-directory=/data/data/com.termux/files/home/drs-ai

# Font
font-size=14

# Colors
color0=#000000
color1=#ff0000
color2=#00ff00
color3=#ffff00
color4=#0000ff
color5=#ff00ff
color6=#00ffff
color7=#ffffff
color8=#808080
color9=#ff0000
color10=#00ff00
color11=#ffff00
color12=#0000ff
color13=#ff00ff
color14=#00ffff
color15=#ffffff

background=#0a0a0a
foreground=#00ff00
cursor=#00ff00
